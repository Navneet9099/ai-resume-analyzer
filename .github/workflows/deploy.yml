name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to GCP using GCP Service Account Key
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Setup Google Cloud SDK commands
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Build the Docker container using Google Cloud Build and register in GCR
      - name: Build and Push Backend Container to GCR
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/resume-analyzer-backend ./backend

      # 5. Deploy the backend container to GCP Cloud Run with injected secret variables
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy resume-analyzer-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/resume-analyzer-backend \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},SECRET_KEY=${{ secrets.SECRET_KEY }},ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=60"
